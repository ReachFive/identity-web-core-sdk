name: Deploy Release

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Nothing is published unless the tests and the package checks pass on the tagged commit.
      - name: Run tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: Smoke-test the UMD bundles
        run: npm run smoke:umd

      - name: Smoke-test the published package
        run: npm run smoke:package

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # `next` follows the newest published version, release candidate or release (see RELEASE.md), so a release
      # moves it too. Right after `npm publish` the registry may not serve the new version yet, and a dist-tag write
      # against it fails until it does: retry rather than fail the release on that race.
      - name: Point next tag at the release
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 60); do
            if npm dist-tag add "@reachfive/identity-core@$version" next; then
              echo "next now points at $version"
              exit 0
            fi
            echo "Attempt $attempt failed; the registry may still be processing the publish. Retrying in 10s..."
            sleep 10
          done
          echo "::error::Timed out after 10 minutes pointing the next dist-tag at $version."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
