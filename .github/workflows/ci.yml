name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Install JUnit coverage reporter
        run: npm install --save-dev jest-junit

      - name: Run tests
        run: npm test -- --ci --reporters=default --reporters=jest-junit
      
      - name: Build
        run: npm run build

      - name: Smoke-test the UMD bundles
        run: npm run smoke:umd

      - name: Report bundle sizes
        run: |
          {
            echo '| bundle | raw | gzip |'
            echo '|---|---:|---:|'
            for f in umd/identity-core.min.js umd/identity-core.js es/main.js cjs/main.js; do
              printf '| `%s` | %s | %s |\n' "$f" "$(wc -c <"$f" | tr -d ' ')" "$(gzip -c "$f" | wc -c | tr -d ' ')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: jest-junit.xml
        env:
          JEST_JUNIT_OUTPUT_NAME: jest-junit.xml
